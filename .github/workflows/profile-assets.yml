# Redraws the profile README's generated images once a day and publishes them to the `output` branch:
#   - contribution snake (Platane/snk)
#   - GitHub activity + top languages cards (scripts/stats.mjs, using the built-in GITHUB_TOKEN)
name: Generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [thang]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render stats and language cards
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Amber snake; contribution cells shade from empty to amber in both themes.
          outputs: |
            dist/github-snake.svg?color_snake=#E0A43B&color_dots=#EBE6DC,#F3DDB0,#EBC57E,#E0A43B,#94600F
            dist/github-snake-dark.svg?color_snake=#E0A43B&color_dots=#1E2A3F,#3D3A2C,#6E5A2C,#A8802F,#E0A43B

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
