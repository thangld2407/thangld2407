<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-label="GitHub activity">
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .row { opacity: 0; animation: rise 0.5s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="479" height="214" rx="12" fill="#16233B" stroke="#2A3A55"/>
  <text class="sans" x="28" y="40" font-size="11" font-weight="bold" letter-spacing="2.6" fill="#E0A43B">GITHUB ACTIVITY</text>
  <rect x="28" y="50" width="32" height="3" fill="#E0A43B"/>
  <g class="row" style="animation-delay:0.10s">
    <rect x="28" y="80" width="6" height="6" fill="#E0A43B"/>
    <text class="sans" x="44" y="88" font-size="14" fill="#9AA6BA">Commits (last 12 months)</text>
    <text class="sans" x="452" y="88" font-size="14" font-weight="bold" fill="#EDE7DC" text-anchor="end">171</text>
  </g>
  <g class="row" style="animation-delay:0.18s">
    <rect x="28" y="106" width="6" height="6" fill="#E0A43B"/>
    <text class="sans" x="44" y="114" font-size="14" fill="#9AA6BA">Pull requests</text>
    <text class="sans" x="452" y="114" font-size="14" font-weight="bold" fill="#EDE7DC" text-anchor="end">8</text>
  </g>
  <g class="row" style="animation-delay:0.26s">
    <rect x="28" y="132" width="6" height="6" fill="#E0A43B"/>
    <text class="sans" x="44" y="140" font-size="14" fill="#9AA6BA">Issues</text>
    <text class="sans" x="452" y="140" font-size="14" font-weight="bold" fill="#EDE7DC" text-anchor="end">0</text>
  </g>
  <g class="row" style="animation-delay:0.34s">
    <rect x="28" y="158" width="6" height="6" fill="#E0A43B"/>
    <text class="sans" x="44" y="166" font-size="14" fill="#9AA6BA">Public repositories</text>
    <text class="sans" x="452" y="166" font-size="14" font-weight="bold" fill="#EDE7DC" text-anchor="end">2</text>
  </g>
  <g class="row" style="animation-delay:0.42s">
    <rect x="28" y="184" width="6" height="6" fill="#E0A43B"/>
    <text class="sans" x="44" y="192" font-size="14" fill="#9AA6BA">Stars earned</text>
    <text class="sans" x="452" y="192" font-size="14" font-weight="bold" fill="#EDE7DC" text-anchor="end">0</text>
  </g>
</svg>
