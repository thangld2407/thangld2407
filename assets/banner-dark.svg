<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Le Dinh Thang</title>
  <desc id="desc">Frontend Developer – Full Stack Developer. Vue.js, React, Node.js, Spring Boot.</desc>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2A3A55"/></pattern>
    <radialGradient id="fade" cx="35%" cy="40%" r="75%"><stop offset="0.2" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="dotMask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="420" rx="16"/></clipPath>
    <clipPath id="cardClip"><rect x="628" y="56" width="512" height="308" rx="14"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/></filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .rise { opacity: 0; animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .card { opacity: 0; animation: card 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s forwards; }
      .line { opacity: 0; animation: type 0.35s ease-out forwards; }
      .rule { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 0.9s cubic-bezier(0.7, 0, 0.2, 1) 0.6s forwards; }
      .caret { animation: blink 1s step-end infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes card { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
      @keyframes type { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
      @keyframes grow { to { transform: scaleX(1); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .card, .line { animation: none; opacity: 1; }
        .rule { animation: none; transform: none; }
        .caret { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#16233B"/>
    <rect width="1200" height="420" fill="url(#dots)" mask="url(#dotMask)"/>

    <text class="sans rise" x="64" y="112" font-size="13" font-weight="bold" letter-spacing="3" fill="#9AA6BA" style="animation-delay:0.1s">CURRICULUM VITAE · HA NOI, VIETNAM</text>
    <text class="sans rise" x="62" y="178" font-size="54" font-weight="bold" letter-spacing="0.5" fill="#EDE7DC" style="animation-delay:0.2s">LE DINH THANG</text>
    <rect class="rule" x="64" y="200" width="64" height="4" fill="#E0A43B"/>
    <text class="sans rise" x="64" y="244" font-size="22" fill="#EDE7DC" style="animation-delay:0.35s">Frontend Developer – Full Stack Developer</text>
    <text class="sans rise" x="64" y="276" font-size="17" fill="#9AA6BA" style="animation-delay:0.45s">Nearly five years building enterprise web apps</text>
    <g class="rise" style="animation-delay:0.55s"><rect x="64" y="316" width="84" height="34" rx="6" fill="none" stroke="#2A3A55"/><text class="sans" x="106" y="338" font-size="14" fill="#EDE7DC" text-anchor="middle">Vue.js</text><rect x="158" y="316" width="76" height="34" rx="6" fill="none" stroke="#2A3A55"/><text class="sans" x="196" y="338" font-size="14" fill="#EDE7DC" text-anchor="middle">React</text><rect x="244" y="316" width="90" height="34" rx="6" fill="none" stroke="#2A3A55"/><text class="sans" x="289" y="338" font-size="14" fill="#EDE7DC" text-anchor="middle">Node.js</text><rect x="344" y="316" width="118" height="34" rx="6" fill="none" stroke="#2A3A55"/><text class="sans" x="403" y="338" font-size="14" fill="#EDE7DC" text-anchor="middle">Spring Boot</text></g>

    <g class="card">
      <rect x="628" y="56" width="512" height="308" rx="14" fill="#FFFDF9" filter="url(#shadow)"/>
      <g clip-path="url(#cardClip)">
        <rect x="628" y="56" width="512" height="44" fill="#F6F3EE"/>
        <rect x="628" y="99" width="512" height="1" fill="#E3DDD2"/>
        <text class="mono" x="652" y="84" font-size="14" font-weight="bold" fill="#1B1F27">profile.ts</text>
        <rect x="646" y="97" width="92" height="3" fill="#E0A43B"/>
        <text class="sans" x="1116" y="83" font-size="11" font-weight="bold" letter-spacing="2.2" fill="#5E6472" text-anchor="end">HA NOI</text>
    <g class="line" style="animation-delay:0.75s">
      <text class="mono" x="664" y="134" font-size="13" fill="#C9C1B3" text-anchor="end">1</text>
      <text class="mono" x="682" y="134" font-size="15" xml:space="preserve"><tspan fill="#5E6472" font-style="italic">// profile.ts</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.87s">
      <text class="mono" x="664" y="159" font-size="13" fill="#C9C1B3" text-anchor="end">2</text>
      <text class="mono" x="682" y="159" font-size="15" xml:space="preserve"><tspan fill="#94600F" font-weight="bold">const </tspan><tspan fill="#1B1F27" font-weight="bold">developer</tspan><tspan fill="#5E6472"> = {</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.99s">
      <text class="mono" x="664" y="184" font-size="13" fill="#C9C1B3" text-anchor="end">3</text>
      <text class="mono" x="682" y="184" font-size="15" xml:space="preserve"><tspan fill="#1B1F27">  name</tspan><tspan fill="#5E6472">: </tspan><tspan fill="#94600F">'Le Dinh Thang'</tspan><tspan fill="#5E6472">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:1.11s">
      <text class="mono" x="664" y="209" font-size="13" fill="#C9C1B3" text-anchor="end">4</text>
      <text class="mono" x="682" y="209" font-size="15" xml:space="preserve"><tspan fill="#1B1F27">  role</tspan><tspan fill="#5E6472">: </tspan><tspan fill="#94600F">'Frontend Developer'</tspan><tspan fill="#5E6472">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:1.23s">
      <text class="mono" x="664" y="234" font-size="13" fill="#C9C1B3" text-anchor="end">5</text>
      <text class="mono" x="682" y="234" font-size="15" xml:space="preserve"><tspan fill="#1B1F27">  location</tspan><tspan fill="#5E6472">: </tspan><tspan fill="#94600F">'Ha Noi, Vietnam'</tspan><tspan fill="#5E6472">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:1.35s">
      <text class="mono" x="664" y="259" font-size="13" fill="#C9C1B3" text-anchor="end">6</text>
      <text class="mono" x="682" y="259" font-size="15" xml:space="preserve"><tspan fill="#1B1F27">  stack</tspan><tspan fill="#5E6472">: [</tspan><tspan fill="#94600F">'Vue.js'</tspan><tspan fill="#5E6472">, </tspan><tspan fill="#94600F">'React'</tspan><tspan fill="#5E6472">, </tspan><tspan fill="#94600F">'Spring Boot'</tspan><tspan fill="#5E6472">],</tspan></text>
    </g>
    <g class="line" style="animation-delay:1.47s">
      <text class="mono" x="664" y="284" font-size="13" fill="#C9C1B3" text-anchor="end">7</text>
      <text class="mono" x="682" y="284" font-size="15" xml:space="preserve"><tspan fill="#1B1F27">  goal</tspan><tspan fill="#5E6472">: </tspan><tspan fill="#94600F">'Delivery / PM'</tspan><tspan fill="#5E6472">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:1.59s">
      <text class="mono" x="664" y="309" font-size="13" fill="#C9C1B3" text-anchor="end">8</text>
      <text class="mono" x="682" y="309" font-size="15" xml:space="preserve"><tspan fill="#5E6472">}</tspan></text><rect class="caret" x="696" y="295" width="8" height="18" fill="#E0A43B"/>
    </g>
        <rect x="628" y="334" width="512" height="30" fill="#F6F3EE"/>
        <rect x="628" y="334" width="512" height="1" fill="#E3DDD2"/>
        <text class="sans" x="652" y="353" font-size="11" fill="#5E6472">TypeScript</text>
        <circle cx="1008" cy="349" r="3" fill="#E0A43B"/>
        <text class="sans" x="1116" y="353" font-size="11" fill="#5E6472" text-anchor="end">me.victorle.xyz</text>
      </g>
    </g>
  </g>
</svg>
